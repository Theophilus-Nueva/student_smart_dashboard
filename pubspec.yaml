name: smart_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  timezone: ^0.11.2
  http: ^1.6.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  geolocator: ^14.0.1
  flutter_local_notifications: ^23.0.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  sensors_plus: ^7.1.1
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_compass: ^0.8.1
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# App icon (generated with `dart run flutter_launcher_icons`).
# Source artwork: assets/icon/app_icon.svg (exported to the PNGs below).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_android_foreground.png"
  # The foreground PNG is already scaled into the safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
